<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background with thick border -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="#FFC93C" stroke="#1B1B3A" stroke-width="24"/>
  
  <!-- Robot Head Shadow -->
  <rect x="156" y="220" width="200" height="160" rx="36" fill="#1B1B3A"/>

  <!-- Robot Head Base -->
  <rect x="146" y="210" width="200" height="160" rx="36" fill="#FFF6E5" stroke="#1B1B3A" stroke-width="16"/>

  <!-- Ears -->
  <rect x="114" y="265" width="32" height="50" rx="10" fill="#FF5D8F" stroke="#1B1B3A" stroke-width="12"/>
  <rect x="366" y="265" width="32" height="50" rx="10" fill="#FF5D8F" stroke="#1B1B3A" stroke-width="12"/>

  <!-- Eyes -->
  <circle cx="200" cy="285" r="24" fill="#4EA8DE" stroke="#1B1B3A" stroke-width="10"/>
  <circle cx="200" cy="285" r="8" fill="#1B1B3A"/>
  <circle cx="292" cy="285" r="24" fill="#4EA8DE" stroke="#1B1B3A" stroke-width="10"/>
  <circle cx="292" cy="285" r="8" fill="#1B1B3A"/>

  <!-- Mouth -->
  <rect x="210" y="330" width="72" height="12" rx="6" fill="#1B1B3A"/>

  <!-- Cheeks (cute pink dots) -->
  <circle cx="172" cy="320" r="10" fill="#FF5D8F" opacity="0.6"/>
  <circle cx="320" cy="320" r="10" fill="#FF5D8F" opacity="0.6"/>

  <!-- Graduation Cap sitting on the robot head -->
  <!-- Cap base / skull cap -->
  <path d="M 186,215 L 186,190 A 70,70 0 0,1 306,190 L 306,215 Z" fill="#1B1B3A" stroke="#1B1B3A" stroke-width="8" stroke-linejoin="round"/>
  
  <!-- Rhombus / Diamond top of the cap -->
  <polygon points="246,120 376,155 246,190 116,155" fill="#FF5D8F" stroke="#1B1B3A" stroke-width="16" stroke-linejoin="round"/>
  <!-- Inner color detail for diamond top -->
  <polygon points="246,132 356,155 246,178 136,155" fill="#FF7A3C" opacity="0.8"/>

  <!-- Tassel button -->
  <circle cx="246" cy="155" r="10" fill="#1B1B3A"/>

  <!-- Tassel band -->
  <path d="M 246,155 Q 186,170 170,210" fill="none" stroke="#FFC93C" stroke-width="8" stroke-linecap="round"/>
  <!-- Tassel fringe -->
  <rect x="158" y="210" width="24" height="30" rx="6" fill="#FFC93C" stroke="#1B1B3A" stroke-width="8"/>
</svg>
